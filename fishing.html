  $('#mmAuth').addEventListener('click', () => { G.audio.unlock(); ui.open('authors'); });
  document.addEventListener('keydown', (e) => { if (G.menuOpen && !G.modalOpen && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); ui.startGame(); } });
  document.addEventListener('pointerdown', (e) => { if (e.target.closest('.ib, .mm-btn')) G.audio.play('click'); });

  // ---------- Реплики NPC ----------
  let bubbleT = 0;
  G.on('npc', (o) => {
    $('#bName').textContent = o.name; $('#bText').textContent = o.text;
    const b = $('#bubble'); b.hidden = false; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    clearTimeout(bubbleT); bubbleT = setTimeout(() => { b.hidden = true; }, 5200);
  });

  ui.welcome = function (off) {
    if (off) {
      G.addMoney(off.gain);
      G.emit('toast', { t: 'Пока тебя не было, пруд принёс ' + G.money(off.gain), k: 'good' });
    }
    if (G.dailyState().can) setTimeout(() => G.emit('toast', { t: 'Доступна ежедневная награда! Меню → Награда', k: 'gold' }), 1200);
  };
})();

/* main.js — запуск, игровой цикл, ограничение FPS, автосохранение */
(function () {
  const G = window.G;
  const T = THREE;

  function boot() {
    const offline = G.load();
    G.ensureQuests();

    // качество по умолчанию: слабые телефоны — ниже
    const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
    if (!G.S.set.quality) {
      const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 4;
      G.S.set.quality = touch ? (mem <= 2 ? 'min' : 'low') : 'high';
    }
    // один раз переводим телефоны на лёгкую графику (раньше по умолчанию была средняя и она тормозила)
    if (touch && !G.S.set.qv2) {
      G.S.set.qv2 = 1;
      if (G.S.set.quality === 'medium' || G.S.set.quality === 'high') G.S.set.quality = 'low';
      G.S.set.shader = false;
    }
    if (touch) document.body.classList.add('touch');
    if (G.S.set.shader == null) G.S.set.shader = G.S.set.quality === 'high' || G.S.set.quality === 'medium';
    G.Q = G.QUALITY[G.S.set.quality] || G.QUALITY.medium;

    const canvas = document.getElementById('c');
    const renderer = new T.WebGLRenderer({ canvas, antialias: G.S.set.quality === 'high' || (G.S.set.quality === 'medium' && !touch), powerPreference: 'high-performance' });
    renderer.shadowMap.type = T.PCFShadowMap;
    G.renderer = renderer;
    const scene = (G.scene = new T.Scene());
    const camera = (G.camera = new T.PerspectiveCamera(58, innerWidth / innerHeight, 0.3, 700));

    G.buildWorld(scene, renderer);
    G.initPlayer(scene, camera);
    G.initFishing(scene);
    G.pondView.init(scene);
    G.initInput(canvas);
    if (G.initEnv) G.initEnv(scene);
    if (G.initEvents) G.initEvents(scene);
    if (G.initDecor) G.initDecor(scene);
    if (G.post && G.post.init) G.post.init(renderer);

    // старт у личного пруда, лицом к нему
    const H = G.HOME_POND, P = G.player;
    P.pos.set(H.cx + 1.5, 0, H.cz + H.rz + 3.2); P.yaw = Math.PI; P.camYaw = Math.PI * 2;
    camera.position.set(P.pos.x, 5.5, P.pos.z + 9);
    camera.lookAt(P.pos.x, 1.7, P.pos.z);

    function resize() {
      renderer.setPixelRatio(G.prNow());
      renderer.setSize(innerWidth, innerHeight, false);
      if (G.post && G.post.ready) G.post.resize();
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
    resize();

    G.pendingWelcome = offline;
    G.audio.applyVolumes && G.audio.applyVolumes();
    G.ui.showMenu();

    // автосохранение
    setInterval(() => { G.checkAch(); G.save(); }, 5000);
    window.addEventListener('pagehide', G.save);
    let hiddenAt = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenAt = Date.now(); G.save(); }
      else if (hiddenAt) {
        const away = Math.min((Date.now() - hiddenAt) / 1000, 3600); hiddenAt = 0;
        if (away > 20 && G.incomePerSec() > 0) { const g = away * G.incomePerSec() * 0.5; G.addMoney(g); G.emit('toast', { t: 'Пока тебя не было, пруд принёс ' + G.money(g), k: 'good' }); }
      }
    });

    // ---------- цикл ----------
    let last = performance.now(), t = 0, fc = 0, ft = 0, shown = false;
    const fpsEl = document.getElementById('fps');
    function frame(now) {
      requestAnimationFrame(frame);
      const el = now - last;
      if (el < 1000 / G.Q.fps - 3) return;
      last = now;
      const dt = Math.min(el / 1000, 0.05); t += dt;
      G.tick(dt);
      P.update(dt, t);
      G.fishing.update(dt, t);
      G.pondView.update(dt, t);
      G.updateWorld(dt, t, camera, P.pos);
      if (G.updateDecor) G.updateDecor(dt, t);
      if (G.updateEvents) G.updateEvents(dt, t);
      if (G.env) G.audio.ambient(dt, G.env, P.moveMag > 0.3);
      G.ui.update(dt);
      G.post.render(renderer, scene, camera, t);
      fc++; ft += el;
      if (ft > 1500 && !G.menuOpen && G.resScale > 0.55 && fc * 1000 / ft < G.Q.fps * 0.72) {   // слабое устройство: снижаем разрешение
        G.resScale = Math.max(0.55, G.resScale - 0.12); resize(); fc = 0; ft = 0;
      }
      if (ft > 1000) { fpsEl.hidden = !G.S.set.fps; if (G.S.set.fps) fpsEl.textContent = Math.round(fc * 1000 / ft) + ' FPS'; fc = 0; ft = 0; }
      if (!shown) {
        shown = true;
        const ld = document.getElementById('loading'); ld.classList.add('gone'); setTimeout(() => ld.remove(), 700);
      }
    }
    requestAnimationFrame(frame);
    G.booted = true;
  }

  try { boot(); } catch (e) {
    console.error(e);
    const t = document.getElementById('ldTxt');
    if (t) t.textContent = 'Не удалось запустить игру: ' + (e && e.message ? e.message : e) + '. Нужен браузер с WebGL.';
    const s = document.querySelector('.spin'); if (s) s.style.display = 'none';
  }
})();

})();
</script>
