/* ---------- Код ивента и промокоды ---------- */
#gate { position: absolute; inset: 0; z-index: 40; background: rgba(4,16,28,.72); display: flex; align-items: center; justify-content: center; padding: 12px; animation: fade .15s; }
#gate[hidden] { display: none; }
#gate .gbox { width: min(92vw, 340px); background: linear-gradient(180deg, var(--ink2), var(--ink)); border: 2px solid var(--line); border-radius: 18px; padding: 18px 16px 16px; box-shadow: var(--shadow); text-align: center; color: #fff; }

.cin { -webkit-user-select: text; user-select: text; }
.cin:focus { border-color: #2aa8ff; }

@keyframes gshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

<title>Рыбный Магнат</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Раскладка: полноэкранная сцена, HUD по краям, панели по центру. Один тёмный стиль для всей игры. */
:root {
  --ink: #0d2438; --ink2: #153753; --ink3: #1d4a6e; --line: rgba(255,255,255,.13);
  --fg: #eaf6ff; --mut: #a2bdd1; --coin: #ffc933; --go: #2fe0a0; --pri: #2aa8ff; --danger: #ff5a5a;
  --shadow: 0 6px 18px rgba(0,20,40,.35);
  --pl: max(16px, env(safe-area-inset-left, 0px));
  --pr: max(16px, env(safe-area-inset-right, 0px));
  --pt: calc(10px + env(safe-area-inset-top, 0px));
  --pb: calc(14px + env(safe-area-inset-bottom, 0px));
  --disp: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #8fd0ff; overscroll-behavior: none; }
body {
  font: 700 15px/1.35 var(--body); color: var(--fg);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:focus-visible, canvas:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
#app { position: fixed; inset: 0; overflow: hidden; }
#ui { position: absolute; inset: 0; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#ui button, #ui .stats, #ui .fhbar, #ui .zinfo { pointer-events: auto; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
kbd { font: 700 12px var(--disp); background: rgba(255,255,255,.2); border-radius: 6px; padding: 1px 7px; margin-right: 8px; }
body.touch kbd { display: none; }

/* ---------- HUD ---------- */
#hud { position: absolute; left: var(--pl); right: var(--pr); top: var(--pt); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.stats { background: rgba(13,36,56,.86); border: 1px solid var(--line); border-radius: 16px; padding: 8px 12px; min-width: 168px; box-shadow: var(--shadow); }
.money { display: flex; align-items: center; gap: 8px; font: 700 24px/1 var(--disp); color: var(--coin); font-variant-numeric: tabular-nums; }
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc933 55%, #c98a00); box-shadow: inset 0 0 0 2px rgba(120,70,0,.45); flex: none; }
.inc { color: var(--go); font: 600 14px var(--disp); margin: 3px 0 6px; font-variant-numeric: tabular-nums; }
.lvl { display: flex; align-items: center; gap: 8px; }
.lvtag { font: 600 12px var(--disp); background: var(--ink3); border-radius: 8px; padding: 2px 8px; white-space: nowrap; }
.xp { flex: 1; height: 7px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; }
.xp i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4fd5ff, #2fe0a0); transition: width .3s; }
.rodname { font: 600 12px var(--body); color: var(--mut); margin-top: 6px; }
.menu { display: flex; gap: 6px; pointer-events: none; }
.ib { position: relative; pointer-events: auto; width: 56px; padding: 7px 0 5px; border-radius: 14px; background: rgba(13,36,56,.86); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ib span { font: 600 10px var(--body); color: var(--mut); }
.ib:hover { background: var(--ink3); }
.ib:active { transform: scale(.95); }
.dot { position: absolute; top: 4px; right: 6px; width: 11px; height: 11px; border-radius: 50%; background: #ff4d6d; border: 2px solid var(--ink); }

/* ---------- Подсказки ---------- */
#prompt { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--pb) + 70px); background: rgba(13,36,56,.9); border: 1px solid var(--line); padding: 9px 16px; border-radius: 999px; display: flex; align-items: center; box-shadow: var(--shadow); white-space: nowrap; pointer-events: none; }
#toasts { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--pt) + 96px); width: min(92vw, 460px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: rgba(13,36,56,.94); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; box-shadow: var(--shadow); animation: tin .25s ease-out, tout .4s ease-in 3s forwards; text-align: center; }
.toast.gold { border-color: var(--coin); color: #ffe9a0; }
.toast.good { border-color: var(--go); }
@keyframes tin { from { transform: translateY(-10px); opacity: 0; } }
@keyframes tout { to { opacity: 0; transform: translateY(-8px); } }
#coinpops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop { position: absolute; font: 700 18px var(--disp); color: #8dffb0; text-shadow: 0 2px 0 rgba(0,40,20,.6); animation: pop 1.3s ease-out forwards; transform: translate(-50%, -50%); }
@keyframes pop { to { transform: translate(-50%, -150%); opacity: 0; } }
#fps { position: absolute; left: var(--pl); bottom: 4px; font: 600 11px var(--disp); color: #fff; background: rgba(0,0,0,.4); padding: 2px 6px; border-radius: 6px; }

/* ---------- Кнопки ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 10px 18px; border-radius: 14px; font: 600 16px var(--disp); background: var(--ink3); border: 1px solid var(--line); box-shadow: 0 3px 0 rgba(0,0,0,.25); min-height: 44px; transition: transform .08s, filter .15s; }
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.pri { background: linear-gradient(#35c7ff, #1f8fe8); border-color: #7fdcff; color: #04223a; }
.btn.go { background: linear-gradient(#52f0b4, #1fc283); border-color: #9bffd6; color: #032a1b; }
.btn.gold { background: linear-gradient(#ffe27a, #ffb21f); border-color: #fff0b0; color: #3a2500; }
.btn.ghost { background: rgba(13,36,56,.86); }
.btn.danger { background: linear-gradient(#ff7a7a, #e23d3d); border-color: #ffb0b0; color: #3b0505; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 11px; }
.btn.big { padding: 13px 26px; font-size: 20px; }
.btn[disabled], .btn.off { filter: grayscale(.85) brightness(.7); cursor: not-allowed; pointer-events: none; }
.btn kbd { color: #04223a; background: rgba(255,255,255,.55); }

/* ---------- Рыбалка: зона и мини-игра ---------- */
#zonebar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--pb) + 8px); display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(94vw, 520px); }
.zinfo { background: rgba(13,36,56,.88); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; justify-content: center; }
.zinfo span { color: var(--mut); font-size: 13px; }
.zbtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#fishhud { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--pb) + 12px); width: min(90vw, 540px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
body.touch #fishhud { bottom: calc(var(--pb) + 176px); }
.fhtext { font: 700 22px var(--disp); text-shadow: 0 2px 0 rgba(0,0,0,.45); text-align: center; }
.fhbar { position: relative; width: 100%; height: 38px; border-radius: 19px; background: rgba(8,24,40,.82); border: 3px solid #fff; box-shadow: var(--shadow); overflow: hidden; }
.fhbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #2fe0a0, #ffe14a, #ff9a3a); transition: width .06s linear; }
.fhbar b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 18px var(--disp); text-shadow: 0 1px 0 rgba(0,0,0,.6); }
.fhbar.shake { animation: shk .25s infinite; }
@keyframes shk { 25% { transform: translate(2px, -1px); } 75% { transform: translate(-2px, 1px); } }
.fhhint { font: 600 14px var(--body); color: #fff; text-shadow: 0 1px 2px #000; }
#fishhud .btn { pointer-events: auto; }

/* ---------- Джойстик и кнопки действий ---------- */
#joyZone { position: absolute; left: 0; bottom: 0; width: 42vw; height: 65%; display: none; touch-action: none; pointer-events: auto; }
body.touch #joyZone { display: block; }
body.touch.fishing #joyZone { display: none; }
#joy { position: absolute; left: var(--pl); bottom: var(--pb); width: 140px; height: 140px; border-radius: 50%; background: rgba(13,36,56,.35); border: 3px solid rgba(255,255,255,.45); pointer-events: none; transition: background .1s; }
#joy.on { background: rgba(13,36,56,.5); border-color: #fff; }
#joyKnob { position: absolute; left: 39px; top: 39px; width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #bfe3ff 60%, #7fb8e8); box-shadow: 0 4px 10px rgba(0,0,0,.3); }
#actions { position: absolute; right: var(--pr); bottom: var(--pb); width: 0; height: 0; }
.rbtn { position: absolute; right: 0; bottom: 0; width: 84px; height: 84px; border-radius: 50%; display: none; align-items: center; justify-content: center; font: 700 15px var(--disp); background: linear-gradient(#ffffff, #cfe6fa); color: #12405f; border: 3px solid #fff; box-shadow: 0 6px 14px rgba(0,20,40,.4); pointer-events: auto; text-align: center; line-height: 1.1; }
.rbtn:active { transform: scale(.92); }
.rbtn svg { width: 36px; height: 36px; stroke-width: 2.6; }
body.touch .rbtn.jump { display: flex; }
body.touch.fishing .rbtn.jump { display: none; }
body.touch .rbtn.act:not([hidden]) { display: flex; bottom: 100px; width: 92px; height: 92px; background: linear-gradient(#ffe27a, #ffb21f); border-color: #fff0b0; color: #3a2500; font-size: 14px; }
.rbtn.pull:not([hidden]) { display: flex; width: 150px; height: 150px; font-size: 28px; background: radial-gradient(circle at 35% 28%, #ff9a9a, #ff3b3b 60%, #c21f1f); color: #fff; border-color: #ffd0d0; animation: pulse .5s infinite alternate; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
@keyframes pulse { to { transform: scale(1.06); } }
.rbtn.pull:active { animation: none; transform: scale(.93); }
body:not(.touch) .rbtn.pull:not([hidden]) { width: 110px; height: 110px; font-size: 22px; bottom: 70px; }

/* ---------- Модальные панели ---------- */
#modal { position: absolute; inset: 0; z-index: 30; background: rgba(4,16,28,.58); display: flex; align-items: center; justify-content: center; padding: calc(10px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); animation: fade .15s; touch-action: none; }
@keyframes fade { from { opacity: 0; } }
.panel { width: min(960px, 100%); max-height: 100%; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--ink2), var(--ink)); border: 2px solid rgba(255,255,255,.2); border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; animation: rise .2s ease-out; }
@keyframes rise { from { transform: translateY(14px) scale(.98); opacity: 0; } }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 12px 20px; border-bottom: 1px solid var(--line); flex: none; }
.phead h2 { margin: 0; font: 700 24px var(--disp); }
.phead .x { width: 44px; height: 44px; border-radius: 12px; background: var(--ink3); font: 700 26px var(--disp); line-height: 1; }
.pbody { overflow-y: auto; overflow-x: hidden; padding: 16px 20px 20px; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
.note { background: rgba(255,201,51,.12); border: 1px solid rgba(255,201,51,.4); color: #ffe9a0; border-radius: 12px; padding: 9px 12px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }
.sub { color: var(--mut); font-weight: 600; }
.sec { font: 700 16px var(--disp); margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
.sec:first-child { margin-top: 0; }
.tabs { display: flex; gap: 6px; padding: 10px 14px 0 14px; overflow-x: auto; flex: none; border-bottom: 1px solid var(--line); touch-action: pan-x; }
.tab { padding: 9px 14px; border-radius: 12px 12px 0 0; font: 600 15px var(--disp); color: var(--mut); white-space: nowrap; position: relative; }
.tab.on { background: var(--ink3); color: #fff; }
.tab .dot { top: 4px; right: 2px; }

/* ---------- Карточки рыб ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.fcard { --rc: #a7b0b8; position: relative; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border: 2px solid var(--rc); border-radius: 16px; padding: 8px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-width: 0; }
.fimg { width: 100%; aspect-ratio: 1.25; display: grid; place-items: center; border-radius: 12px; background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--rc) 38%, transparent), transparent 70%); }
.fimg img { width: 86%; height: 100%; object-fit: contain; pointer-events: none; }
.fname { font: 600 15px var(--disp); line-height: 1.15; min-height: 2.3em; display: grid; place-items: center; overflow-wrap: anywhere; }
.finc { color: var(--go); font: 600 14px var(--disp); font-variant-numeric: tabular-nums; }
.fbtns { display: flex; gap: 6px; margin-top: 4px; width: 100%; }
.fbtns .btn { flex: 1; padding: 6px 4px; min-height: 36px; font-size: 13px; border-radius: 10px; }
.tag { display: inline-block; font: 600 11px var(--disp); padding: 1px 8px; border-radius: 999px; color: #fff; background: color-mix(in srgb, var(--rc) 55%, #0b1b2b); border: 1px solid var(--rc); }
.mtag { display: inline-block; font: 600 11px var(--disp); padding: 1px 8px; border-radius: 999px; color: #1d1100; }
.m-gold { background: linear-gradient(#ffe27a, #ffb21f); }
.m-rainbow { background: linear-gradient(90deg, #ff7a9a, #ffd36a, #7affc0, #7ab8ff, #d07aff); }
.m-diamond { background: linear-gradient(#d8fbff, #6fdcff); }
.fcard.unk .fimg img { filter: brightness(0) opacity(.45); }
.fcard.unk { border-color: rgba(255,255,255,.18); cursor: default; }
.fcard.unk .tag { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }
.fcard.pick { cursor: pointer; }
.fcard.pick:hover { transform: translateY(-2px); }
.fcard.mut-gold { box-shadow: 0 0 14px rgba(255,201,51,.45); }
.fcard.mut-rainbow { animation: rbglow 3s linear infinite; }
.fcard.mut-diamond { box-shadow: 0 0 16px rgba(127,233,255,.6); }
@keyframes rbglow { 0% { box-shadow: 0 0 14px #ff7a9a; } 33% { box-shadow: 0 0 14px #ffe27a; } 66% { box-shadow: 0 0 14px #7affc0; } 100% { box-shadow: 0 0 14px #ff7a9a; } }
.rbt { background: linear-gradient(90deg, #ff5f6d, #ffc371, #fff47a, #6dffb3, #6db8ff, #c36dff, #ff5f6d); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: rbmove 3s linear infinite; }
@keyframes rbmove { to { background-position: 200% 0; } }
.eterglow { color: #fff6c8; animation: eter 1.6s ease-in-out infinite alternate; }
@keyframes eter { from { text-shadow: 0 0 6px #fff1a8, 0 0 14px #ffd86b; } to { text-shadow: 0 0 14px #fff, 0 0 30px #ffe27a, 0 0 46px #ffb21f; } }
.fcard.r6 { border-image: none; animation: rbglow 3s linear infinite; }
.fcard.r7 { box-shadow: 0 0 18px rgba(255,241,168,.7), inset 0 0 14px rgba(255,241,168,.2); }

/* ---------- Магазин и улучшения ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; gap: 14px; align-items: center; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.item.cur { border-color: var(--go); background: rgba(47,224,160,.08); }
.item img { width: 96px; height: 96px; object-fit: contain; flex: none; }
.item .info { flex: 1; min-width: 0; }
.item h3 { margin: 0 0 3px; font: 700 18px var(--disp); }
.stat { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--mut); font-size: 13px; }
.stat b { color: var(--fg); }
.item .buy { flex: none; min-width: 120px; }
.pips { display: flex; gap: 2px; margin: 6px 0 2px; }
.pips i { flex: 1; height: 7px; border-radius: 3px; background: rgba(255,255,255,.14); max-width: 18px; }
.pips i.on { background: linear-gradient(#52f0b4, #1fc283); }
.bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,.13); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #4fd5ff, #2fe0a0); }

/* ---------- Награды, задания, достижения ---------- */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { background: rgba(255,255,255,.06); border: 2px solid var(--line); border-radius: 12px; padding: 8px 2px; text-align: center; font: 600 12px var(--disp); min-width: 0; }
.day b { display: block; font-size: 15px; color: var(--coin); overflow-wrap: anywhere; }
.day.now { border-color: var(--coin); background: rgba(255,201,51,.15); }
.day.done { opacity: .5; }
.q { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; flex-wrap: wrap; }
.q .info { flex: 1; min-width: 160px; }
.ach { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.04); margin-bottom: 6px; opacity: .55; }
.ach.on { opacity: 1; background: rgba(255,201,51,.1); border: 1px solid rgba(255,201,51,.35); }
.ach .ck { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; flex: none; font: 700 16px var(--disp); }
.ach.on .ck { background: var(--coin); color: #3a2500; }
.seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.seg button { padding: 9px 16px; background: var(--ink); font: 600 15px var(--disp); min-height: 42px; }
.seg button.on { background: var(--pri); color: #04223a; }
.big-num { font: 700 30px var(--disp); color: var(--coin); }
.detail { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
.detail img { width: min(260px, 70vw); aspect-ratio: 1; object-fit: contain; }
.detail .dd { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.kv span:first-child { color: var(--mut); }

/* ---------- Карточка улова ---------- */

      const d = JSON.parse(raw), f = fresh();
      const s = Object.assign(f, d);
      s.up = Object.assign(f.up, d.up || {});
      s.stats = Object.assign(f.stats, d.stats || {});
      s.set = Object.assign(f.set, d.set || {});
      s.daily = Object.assign(f.daily, d.daily || {});
      s.spots = Object.assign({ main: true }, d.spots || {});
      s.rods = f.rods.map((v, i) => !!(d.rods && d.rods[i]) || i === 0);
      s.inv = (d.inv || []).filter((i) => G.FISH_BY_ID[i.f]);
      s.hot = Array.from({ length: 9 }, (_, i) => ((d.hot && d.hot[i]) || null));
      s.pond = (d.pond || []).filter((i) => G.FISH_BY_ID[i.f]);
      G.S = s;
      const away = Math.min((Date.now() - (d.seen || Date.now())) / 1000, 3600);
      return away > 30 ? { away, gain: away * G.incomePerSec() * 0.5 } : null;
    } catch (e) { console.warn('save corrupt', e); return null; }
  };
  G.resetAll = function () {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    const q = G.S.set;
    G.S = fresh(); G.S.set = q;
    G.save();
  };

  // ---------- вспомогательные формулы ----------
  G.rod = () => G.RODS[G.S.rod];
  G.fishMut = (f) => (f.m ? G.MUTATIONS[f.m].mult : 1);
  G.fishInc = (f) => G.FISH_BY_ID[f.f].inc * G.fishMut(f) + (f.h ? G.FISH_BY_ID[f.f].inc * G.HORROR_ADD : 0);
  G.vm = (f) => (f.h ? 'horror' : f.m || '');   // какая мутация показывается на модели
  G.capacity = () => G.BASE_CAPACITY + 2 * G.S.up.capacity;
  G.levelBonus = () => 1 + 0.02 * (G.S.level - 1);
  G.rebirthIncome = () => 1 + 0.5 * G.S.rebirths;
  G.rebirthLuck = () => 1 + 0.1 * G.S.rebirths;
  G.incomeMult = () => (1 + 0.1 * G.S.up.income) * G.levelBonus() * G.rebirthIncome();
  G.incomePerSec = function () {
    let t = 0;
    for (const f of G.S.pond) t += G.fishInc(f);
    return t * G.incomeMult();
  };
  G.luck = (spot) => G.rod().luck * (1 + 0.06 * G.S.up.luck) * G.rebirthLuck() * (spot ? spot.luck : 1) * (G.env ? G.env.luckMult : 1) * (G.evt && G.evt.def.luck ? G.evt.def.luck : 1);
  G.upCost = (id) => {
    const u = G.UPGRADES.find((x) => x.id === id);
    return Math.floor(u.base * Math.pow(u.grow, G.S.up[id]));
  };
  G.needXp = (l) => Math.floor(40 * Math.pow(l, 1.6));
  G.market = { mult: [1, 1, 1, 1, 1, 1, 1, 1], next: 0, t: 0 };
  G.rollMarket = function () {
    G.market.mult = G.RARITIES.map(() => Math.round(G.rnd(0.8, 1.5) * 100) / 100);
    G.emit('market');
  };
  G.rollMarket();
  G.marketTick = function (dt) {
    G.market.t += dt;
    if (G.market.t > 240) { G.market.t = 0; G.rollMarket(); G.emit('toast', { t: 'Спрос на рынке изменился', k: '' }); }
  };
  G.sellPrice = (f) => Math.round(G.fishInc(f) * 15 * G.market.mult[G.FISH_BY_ID[f.f].r]);
  G.sellMany = function (pred) {
    const S = G.S; let tot = 0, n = 0;
    S.inv = S.inv.filter((f) => { if (pred(f)) { tot += G.sellPrice(f); n++; return false; } return true; });
    if (n) { S.stats.sold += n; G.addMoney(tot); G.save(); }
    return { tot, n };
  };

  // игровые параметры мини-игры
  // чем реже рыба, тем слабее один клик и сильнее откат
  G.fillPerClick = (r) => 5.5 * G.rod().fill * (1 + 0.12 * G.S.up.fill) / (1 + 0.45 * (r || 0));
  G.decay = (r) => (6 + 1.6 * r) / (1 + 0.08 * G.S.up.power);
  G.escapeTime = (r) => Math.max(1.8, 3.4 - r * 0.2);
  G.biteWait = () => (G.rnd(1.5, 4)) / (1 + 0.08 * G.S.up.speed);

  // ---------- шансы ----------
  G.rarityProbs = function (spot) {
    const luck = G.luck(spot), maxR = G.rod().maxR;
    const w = G.RARITIES.map((r, i) => (i > maxR ? 0 : r.w * Math.pow(luck, 0.22 * i)));
    const tot = w.reduce((a, b) => a + b, 0);
    return w.map((x) => x / tot);
  };
  G.fishChance = function (fish, spot) {
    const p = G.rarityProbs(spot || G.SPOTS[0]);
    return p[fish.r] / G.FISH_BY_RARITY[fish.r].length;
  };
  G.rollRarity = function (spot) {
    const p = G.rarityProbs(spot);
    let x = Math.random();
    for (let i = 0; i < p.length; i++) { x -= p[i]; if (x <= 0 && p[i] > 0) return i; }
    return 0;
  };
  G.rollMutation = function (spot) {
    const k = G.rod().mut * (spot ? spot.mut : 1) * (1 + 0.02 * G.S.up.luck);
    const M = G.MUTATIONS, em = (G.evt && G.evt.def.mut) || {};
    const pd = Math.min(0.35, M.diamond.p * k * (em.diamond || 1)), pr = Math.min(0.4, M.rainbow.p * k * (em.rainbow || 1)), pg = Math.min(0.55, M.gold.p * k * (em.gold || 1));
    const r = Math.random();
    if (r < pd) return 'diamond';
    if (r < pd + pr) return 'rainbow';
    if (r < pd + pr + pg) return 'gold';
    return '';
  };
  G.rollCatch = function (spot, forceR) {
    const r = forceR != null ? forceR : G.rollRarity(spot);
    const list = G.FISH_BY_RARITY[r];
    return { fish: list[Math.floor(Math.random() * list.length)], mut: G.rollMutation(spot) };
  };

  // ---------- деньги, опыт ----------
  G.addMoney = function (n, passive) {
    G.S.money += n;
    if (n > 0) { G.S.totalEarned += n; G.questEvent('earn', n); }
  };
  G.spend = function (n) {
    if (G.S.money < n) return false;
    G.S.money -= n;
    return true;
  };
  G.addXp = function (n) {
    G.S.xp += n;
    let up = false;
    while (G.S.xp >= G.needXp(G.S.level)) { G.S.xp -= G.needXp(G.S.level); G.S.level++; up = true; }
    if (up) G.emit('levelup', G.S.level);
  };

  // ---------- рыба ----------
  G.giveFish = function (fish, mut) {
    const item = { u: G.S.uid++, f: fish.id };
    if (mut) item.m = mut;
    G.S.inv.push(item);
    const hi = G.S.hot.indexOf(null); if (hi >= 0) G.S.hot[hi] = item.u;
    return item;
  };
  G.registerCatch = function (fish, mut) {
    const S = G.S;
    const item = G.giveFish(fish, mut);
    S.stats.catches++;
    if (mut) S.stats.mutations++;
    const c = S.col[fish.id] || (S.col[fish.id] = { n: 0, m: {} });
    const isNew = c.n === 0;
    c.n++;
    if (mut) c.m[mut] = (c.m[mut] || 0) + 1;
    const xp = Math.round(6 * Math.pow(fish.r + 1, 1.7) * (mut ? G.MUTATIONS[mut].mult * 0.6 : 1));
    G.addXp(xp);
    G.questEvent('catch', { fish, mut });
    G.checkAch();
    G.save();
    return { item, isNew, xp };
  };
  G.placeFish = function (uid) {
    const S = G.S;
    if (S.pond.length >= G.capacity()) return false;
    const i = S.inv.findIndex((x) => x.u === uid);
    if (i < 0) return false;
    const pit = S.inv.splice(i, 1)[0];
    if (G.evt && G.evt.def.id === 'verity') pit.h = 1;   // во время Verity новая рыба в пруду тоже мутирует
    S.pond.push(pit);
    S.stats.placed++;
    G.questEvent('place', 1);
    G.checkAch(); G.emit('pond'); G.save();
    return true;
  };
  G.takeFish = function (uid) {
    const S = G.S;
    const i = S.pond.findIndex((x) => x.u === uid);
    if (i < 0) return false;
    S.inv.push(S.pond.splice(i, 1)[0]);
    G.emit('pond'); G.save();
    return true;
  };
  G.sellFish = function (uid) {
    const S = G.S;
    const i = S.inv.findIndex((x) => x.u === uid);
    if (i < 0) return 0;
    const p = G.sellPrice(S.inv[i]);
    S.inv.splice(i, 1);
    S.stats.sold++;
    G.addMoney(p);
    G.save();
    return p;
  };
  G.placeBest = function () {
    const S = G.S;
    const sorted = S.inv.slice().sort((a, b) => G.fishInc(b) - G.fishInc(a));
    let n = 0;
    for (const f of sorted) { if (S.pond.length >= G.capacity()) break; G.placeFish(f.u); n++; }
    return n;
  };

  // ---------- покупки ----------
  G.buyRod = function (i) {
    const S = G.S, r = G.RODS[i];
    if (S.rods[i]) { S.rod = i; G.emit('rod'); G.save(); return 'equip'; }
    if (!G.spend(r.price)) return 'poor';
    S.rods[i] = true; S.rod = i; S.stats.bought++;
    G.checkAch(); G.emit('rod'); G.save();
    return 'bought';
  };
  G.buyUpgrade = function (id) {
    const u = G.UPGRADES.find((x) => x.id === id);
    if (G.S.up[id] >= u.max) return 'max';
    if (!G.spend(G.upCost(id))) return 'poor';
    G.S.up[id]++; G.S.stats.bought++;
    G.questEvent('buy', 1);
    G.checkAch(); G.emit('upgrade'); G.save();
    return 'ok';
  };

  // ---------- Rebirth ----------
  G.rebirthCost = () => 1000000 * Math.pow(4, G.S.rebirths);
  G.canRebirth = () => G.S.money >= G.rebirthCost();
  G.doRebirth = function () {
    if (!G.canRebirth()) return false;
    const S = G.S;
    S.rebirths++;
    S.money = 0; S.inv = []; S.pond = []; S.hot = S.hot.map(() => null);
    S.rods = G.RODS.map((_, i) => i === 0); S.rod = 0;
    S.up = { speed: 0, power: 0, luck: 0, fill: 0, capacity: 0, income: 0 };
    G.checkAch(); G.emit('pond'); G.emit('rod'); G.emit('upgrade'); G.save();
    return true;
  };

  // ---------- ежедневная награда ----------
  G.dailyState = function () {
    const d = G.S.daily, t = G.today();
    if (d.last === t) return { can: false, day: ((d.streak - 1) % 7) };
    const streak = d.last === G.yesterday() ? d.streak + 1 : 1;
    return { can: true, day: (streak - 1) % 7, streak };
  };
  G.dailyReward = (day) => Math.round((200 + 60 * G.incomePerSec()) * (day + 1));
  G.claimDaily = function () {
    const st = G.dailyState();
    if (!st.can) return null;
    const money = G.dailyReward(st.day);
    G.S.daily = { last: G.today(), streak: st.streak };
    G.addMoney(money);
    let fish = null;
    if (st.day === 6) {
      const c = G.rollCatch(G.SPOTS[0], 3);
      fish = c.fish; G.giveFish(c.fish, c.mut);
      const col = G.S.col[c.fish.id] || (G.S.col[c.fish.id] = { n: 0, m: {} });
      col.n++;
    }
    G.save();
    return { money, fish };
  };

  // ---------- ежедневные задания ----------
  const QT = [
    { k: 'catch',  txt: (n) => 'Поймать рыб: ' + n, ev: 'catch', t: [6, 12], base: 150, f: () => true },
    { k: 'unc',    txt: (n) => 'Необычные рыбы или лучше: ' + n, ev: 'catch', t: [3, 5], base: 250, f: (p) => p.fish.r >= 1 },
    { k: 'rare',   txt: (n) => 'Редкие рыбы или лучше: ' + n, ev: 'catch', t: [1, 2], base: 500, f: (p) => p.fish.r >= 2 },
    { k: 'earn',   txt: (n) => 'Заработать $' + G.fmt(n), ev: 'earn', t: null, base: 200, f: () => true },
    { k: 'place',  txt: (n) => 'Разместить рыб в пруду: ' + n, ev: 'place', t: [2, 4], base: 200, f: () => true },
    { k: 'buy',    txt: (n) => 'Купить улучшений: ' + n, ev: 'buy', t: [1, 2], base: 300, f: () => true },
    { k: 'mut',    txt: () => 'Поймать рыбу с мутацией', ev: 'catch', t: [1, 1], base: 800, f: (p) => !!p.mut },
  ];
  G.ensureQuests = function () {
    const t = G.today();
    if (G.S.quests.date === t && G.S.quests.list.length) return;
    const seed = parseInt(t.replace(/-/g, ''), 10);
    const rng = G.mulberry32(seed);
    const pool = QT.slice();
    const list = [];
    while (list.length < 3) {
      const tpl = pool.splice(Math.floor(rng() * pool.length), 1)[0];
      const inc = G.incomePerSec();
      const target = tpl.t ? tpl.t[0] + Math.floor(rng() * (tpl.t[1] - tpl.t[0] + 1)) : Math.max(500, Math.round(inc * 120 / 100) * 100);
      list.push({ k: tpl.k, target, prog: 0, done: false, claimed: false, reward: Math.round(tpl.base * (1 + inc * 0.5)) * (tpl.t ? Math.ceil(target / (tpl.t[0])) : 1) });
    }
    G.S.quests = { date: t, list };
  };
  G.questText = (q) => QT.find((x) => x.k === q.k).txt(q.target);
  G.questEvent = function (ev, payload) {
    if (!G.S.quests.list) return;
    G.S.quests.list.forEach((q) => {
      if (q.done) return;
      const tpl = QT.find((x) => x.k === q.k);
      if (tpl.ev !== ev || !tpl.f(payload)) return;
      q.prog += ev === 'earn' ? payload : (typeof payload === 'number' ? payload : 1);
      if (q.prog >= q.target) { q.prog = q.target; q.done = true; G.emit('toast', { t: 'Задание выполнено: ' + G.questText(q), k: 'good' }); }
    });
  };
  G.claimQuest = function (i) {
    const q = G.S.quests.list[i];
    if (!q || !q.done || q.claimed) return false;
    q.claimed = true; G.addMoney(q.reward); G.addXp(25); G.save();
    return true;
  };

  // ---------- достижения ----------
  const cnt = () => Object.keys(G.S.col).length;
  const hasR = (r) => G.FISH.some((f) => f.r >= r && G.S.col[f.id]);
  G.ACH = [
    { id: 'c1',   name: 'Первая рыбка',        desc: 'Поймать первую рыбу',            rw: 100,   ok: () => G.S.stats.catches >= 1 },
    { id: 'c25',  name: 'Рыбак',               desc: 'Поймать 25 рыб',                 rw: 500,   ok: () => G.S.stats.catches >= 25 },
    { id: 'c200', name: 'Заядлый рыбак',       desc: 'Поймать 200 рыб',                rw: 8000,  ok: () => G.S.stats.catches >= 200 },
    { id: 'col10',name: 'Коллекционер',        desc: 'Открыть 10 видов рыб',           rw: 2000,  ok: () => cnt() >= 10 },
    { id: 'col20',name: 'Знаток рыб',          desc: 'Открыть 20 видов рыб',           rw: 20000, ok: () => cnt() >= 20 },
    { id: 'colall',name:'Хранитель вод',       desc: 'Открыть все виды рыб',           rw: 1e6,   ok: () => cnt() >= G.FISH.length },
    { id: 'epic', name: 'Фиолетовый блеск',    desc: 'Поймать эпическую рыбу',         rw: 1500,  ok: () => hasR(3) },
    { id: 'leg',  name: 'Золотая лихорадка',   desc: 'Поймать легендарную рыбу',       rw: 10000, ok: () => hasR(4) },
    { id: 'myth', name: 'Из другого мира',     desc: 'Поймать мифическую рыбу',        rw: 60000, ok: () => hasR(5) },
    { id: 'sec',  name: 'Тайна раскрыта',      desc: 'Поймать секретную рыбу',         rw: 5e5,   ok: () => hasR(6) },
    { id: 'eter', name: 'Навсегда',            desc: 'Поймать вечную рыбу',            rw: 5e6,   ok: () => hasR(7) },
    { id: 'mut',  name: 'Мутант',              desc: 'Поймать рыбу с мутацией',        rw: 3000,  ok: () => G.S.stats.mutations >= 1 },
    { id: 'i100', name: 'Первые деньги',       desc: 'Доход пруда $100/сек',           rw: 5000,  ok: () => G.incomePerSec() >= 100 },
    { id: 'i2k',  name: 'Рыбный магнат',       desc: 'Доход пруда $2 000/сек',         rw: 1e5,   ok: () => G.incomePerSec() >= 2000 },
    { id: 'i50k', name: 'Король пруда',        desc: 'Доход пруда $50 000/сек',        rw: 3e6,   ok: () => G.incomePerSec() >= 50000 },
    { id: 'spot', name: 'Исследователь',       desc: 'Найти секретное место',          rw: 4000,  ok: () => G.S.spots.magic || G.S.spots.crystal },
    { id: 'spot2',name: 'Следопыт',            desc: 'Найти оба секретных места',      rw: 20000, ok: () => G.S.spots.magic && G.S.spots.crystal },
    { id: 'rb',   name: 'Новая жизнь',         desc: 'Сделать Rebirth',                rw: 50000, ok: () => G.S.rebirths >= 1 },
    { id: 'rod',  name: 'Космический улов',    desc: 'Купить космическую удочку',      rw: 2e6,   ok: () => G.S.rods[5] },
  ];
  G.checkAch = function () {
    for (const a of G.ACH) {
      if (!G.S.ach[a.id] && a.ok()) {
        G.S.ach[a.id] = true;
        G.addMoney(a.rw);
        G.emit('toast', { t: 'Достижение: ' + a.name + ' (+' + G.money(a.rw) + ')', k: 'gold' });
      }
    }
  };

  G.tick = function (dt) {
    G.marketTick(dt);
    const inc = G.incomePerSec();
    if (inc > 0) { G.S.money += inc * dt; G.S.totalEarned += inc * dt; G.questEvent('earn', inc * dt); }
  };
})();

/* audio.js — мягкие звуки (WebAudio), ambient (птицы, сверчки, дождь, гром, ветер) и фоновая музыка */
(function () {
  const G = window.G;
  let ctx = null, sfx = null, amb = null, master = null, verb = null;
  const A = (G.audio = { music: null, started: false });

  const PENTA = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 784, 880, 1046.5, 1174.7];

  A.unlock = function () {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; return; }
      master = ctx.createGain(); master.gain.value = 0.9;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      sfx = ctx.createGain(); sfx.connect(master);
      amb = ctx.createGain(); amb.connect(master);
      // реверберация из затухающего шума
      const len = Math.floor(ctx.sampleRate * 1.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb = ctx.createConvolver(); verb.buffer = ir;
      const wet = ctx.createGain(); wet.gain.value = 0.32; sfx.connect(verb); verb.connect(wet); wet.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      // непрерывные дождь и ветер
      const mk = (type, freq, q) => {
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
        const g = ctx.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(amb); s.start(); return g;
      };
      rainG = mk('highpass', 1500); windG = mk('lowpass', 420);
      A.applyVolumes();
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (A.music && A.music.paused && A.started && G.S.set.music && !evKey) A.music.play().catch(() => {});
  };

  A.applyVolumes = function () {
    const s = G.S.set;

    if (A.music) A.music.volume = s.music ? G.clamp(s.musicVol, 0, 1) : 0;
    if (evKey && evEl[evKey]) evEl[evKey].volume = evVol();
  };

  // ---------- музыка ----------
  A.startMusic = function () {
    A.started = true;

        m.addEventListener('error', () => { /* файла нет: игра без музыки */ });

    } else A.music.pause();
  };
  A.setMusic = function (on) {
    G.S.set.music = on; A.applyVolumes();
    if (evKey && evEl[evKey]) { if (on) evEl[evKey].play().catch(() => {}); else evEl[evKey].pause(); return; }
    if (A.music) { if (on && A.started) A.music.play().catch(() => {}); else A.music.pause(); }
  };

  G.updateEnv = function (dt, t, cam, player) {

    // свет

    E.flash = Math.max(0, E.flash - dt * 2.2);

    // небесные тела (дети неба, дистанция 285)
    W.sunDisc.position.copy(sv).multiplyScalar(285); W.sunGlow.position.copy(W.sunDisc.position);
    const sunVis = sUp > -0.05 && E.cloud < 0.9 && E.rain < 0.5 && ok < 0.5;
    W.sunDisc.visible = W.sunGlow.visible = sunVis;
    W.sunDisc.material.color.set(0xfff6c8).lerp(C.sun, 0.35);
    moon.position.set(-sv.x * 285, -sUp * 250 + 40, -sv.z * 285); moonGlow.position.copy(moon.position);
    moon.visible = moonGlow.visible = (-sUp > -0.05) && E.cloud < 0.85 && ok < 0.5;

    // облака
    const lum = 0.28 + 0.72 * E.day;
    const cc = C.a.setRGB(1, 1, 1).lerp(C.grey.clone().multiplyScalar(1.1), E.cloud * 0.75 + E.rain * 0.2).lerp(C.sun, (1 - E.day) * 0.0 + (E.day < 0.9 && E.night < 0.9 ? 0.35 : 0));

        q.y -= q.s * dt; if (q.y < 0) { q.y = 20 + Math.random() * 4; q.x = (Math.random() - 0.5) * 36; q.z = (Math.random() - 0.5) * 36; }

        rainPos[i * 6 + 3] = q.x - 0.18; rainPos[i * 6 + 4] = q.y - 0.9; rainPos[i * 6 + 5] = q.z;

    if (flies.visible) {
      for (let i = 0; i < fliesBase.length; i++) {

    G.envState = { day: E.day, night: E.night, rain: E.rain, cloud: E.cloud, fog: E.fog };
  };
})();

    ballGlow = new T.Mesh(new T.IcosahedronGeometry(5.5, 1), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, depthWrite: false, blending: T.AdditiveBlending, fog: false }));
    ball.add(ballGlow);
    const rod = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 30, 4), new T.MeshBasicMaterial({ color: 0xcccccc })); rod.position.y = 15 + 3.2; ball.add(rod);
    discoGrp.add(ball);
  }

  function updateDisco(dt, t) {
    if (!discoGrp) return;
    const on = D.on && !!G.evt && G.evt.def.id === 'disco';
    discoGrp.visible = on; if (!on) return;
    const el = DUR - G.evt.t, at = G.audio.eventTime();
    D.t = at >= 0 ? at : el;
    const ph = (D.t / BP) % 1; D.pulse = Math.pow(1 - ph, 2.5);
    D.hue = (D.t * 0.05) % 1;
    const step = Math.floor(D.t / (BP / 2));
    const h = D.hue, p = D.pulse;
    O.top.setHSL(h, 0.85, 0.16); O.hor.setHSL((h + 0.12) % 1, 0.9, 0.4 + 0.1 * p); O.fog.setHSL((h + 0.12) % 1, 0.8, 0.22);
    O.hemi.setHSL((h + 0.5) % 1, 0.95, 0.62); O.hemiG.setHSL((h + 0.25) % 1, 0.85, 0.32); O.sun.setHSL((h + 0.33) % 1, 1, 0.62);
    O.cloud.setHSL((h + 0.2) % 1, 0.9, 0.55); O.cloudE.setHSL((h + 0.2) % 1, 0.9, 0.4);
    O.hemiI = 0.8 + 0.55 * p; O.sunMul = 0.6 + 0.6 * p; O.fogNear = 30; O.fogFar = 170; O.stars = 0.9; O.horror = 0;

    const P = G.player.pos;
    discoGrp.position.set(0, 0, 0);
    const gx = Math.round(P.x / TILE), gz = Math.round(P.z / TILE);
    const key = gx + ',' + gz + ',' + step;
    if (key !== floorKey) {
      floorKey = key; const half = floorN >> 1; let i = 0;
      for (let a = -half; a <= half; a++) for (let b = -half; b <= half; b++, i++) {
        const cx = gx + a, cz = gz + b;
        dm.position.set(cx * TILE, 0.07, cz * TILE); dm.updateMatrix(); floor.setMatrixAt(i, dm.matrix);
        const dist = Math.hypot(a, b) / (half + 0.5), fade = Math.max(0.12, 1 - dist * dist);
        dc.setHSL(((cx * 0.11 + cz * 0.17 + step * 0.137) % 1 + 1) % 1, 1, 0.5).multiplyScalar(fade);
        floor.setColorAt(i, dc);
      }
      floor.instanceMatrix.needsUpdate = true; floor.instanceColor.needsUpdate = true;
    }
    floor.material.opacity = 0.5 + 0.2 * p;
    beams.forEach((m, i) => {
      const a = m.userData.a + t * 0.25, R = 12 + (i % 2) * 5;
      m.position.set(P.x + Math.cos(a) * R, 0, P.z + Math.sin(a) * R);
      m.rotation.set(Math.sin(t * 1.3 + i * 1.7) * 0.5, 0, Math.cos(t * 1.1 + i * 2.1) * 0.5);
      m.material.color.setHSL((h + i / beams.length) % 1, 1, 0.55); m.material.opacity = 0.14 + 0.14 * p;
    });
    ball.rotation.y += dt * 0.9; ball.scale.setScalar(1 + 0.07 * p);
    ballGlow.material.color.setHSL((h + 0.5) % 1, 1, 0.6);
  }

  // ---------- Verity ----------
  const V = { g: null, body: null, glow: null, pos: new T.Vector3(), sc: 0, glitchT: 10, skyG: null, flick: 0, on: false };

  function buildVerity(scene) {
    const low = G.Q.fps <= 30, tex = smileyTex();
    const geo = new T.SphereGeometry(1, low ? 14 : 22, low ? 10 : 16);
    V.g = new T.Group(); V.g.visible = false;
    V.body = new T.Mesh(geo, new T.MeshBasicMaterial({ map: tex }));
    V.glow = new T.Mesh(new T.SphereGeometry(1, 12, 8), new T.MeshBasicMaterial({ color: 0xff1010, transparent: true, opacity: 0.2, depthWrite: false, blending: T.AdditiveBlending, side: T.BackSide }));
    V.glow.scale.setScalar(1.4);
    V.g.add(V.body, V.glow); scene.add(V.g);
    // огромный смайлик в кровавом небе (виден, если посмотреть вверх)
    V.skyG = new T.Group(); V.skyG.visible = false;
    const sb = new T.Mesh(geo, new T.MeshBasicMaterial({ map: tex, fog: false }));
    const sg = new T.Mesh(new T.SphereGeometry(1, 12, 8), new T.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.18, depthWrite: false, blending: T.AdditiveBlending, side: T.BackSide, fog: false }));
    sg.scale.setScalar(1.7);
    V.skyG.add(sb, sg); V.skyG.scale.setScalar(42);
    V.skyG.position.set(-95, 170, -190);
    G.world.sky.add(V.skyG); V.skyG.lookAt(0, 0, 0);
    V.skyG.userData.glow = sg;
  }

  function verityStart() {
    const P = G.player.pos, a = Math.random() * 6.283;
    V.pos.set(P.x + Math.cos(a) * 42, 0, P.z + Math.sin(a) * 42);
    V.sc = 0.001; V.glitchT = 9 + Math.random() * 5; V.g.visible = true; V.skyG.visible = true; V.on = true;
  }

  function infectFish() {
    const before = G.incomePerSec(); let n = 0;
    for (const f of G.S.pond) if (!f.h) { f.h = 1; n++; }
    G.emit('pond'); G.save();
    const H = G.HOME_POND;
    if (G.fx) G.fx.burst(H.cx, 1.2, H.cz, 70, '#ff2020');
    setTimeout(() => { G.emit('thunder'); G.audio.play('thunder'); }, 300);
    if (n) G.emit('toast', { t: '😊 Verity заразил ' + n + ' рыб: HORROR! Доход +$' + G.fmt(G.incomePerSec() - before) + '/сек', k: 'gold' });
    else G.emit('toast', { t: '😊 В пруду нет рыб: Horror получат те, кого посадишь сюда во время Verity', k: 'gold' });
  }

  function updateVerity(dt, t) {
    if (!V.g) return;
    const active = !!G.evt && G.evt.def.id === 'verity';
    if (active) {
      O.top.setRGB(0.16, 0, 0.01); O.hor.setRGB(0.62, 0.03, 0.02); O.fog.setRGB(0.3, 0.02, 0.02);
      O.hemi.setRGB(0.95, 0.28, 0.24); O.hemiG.setRGB(0.28, 0.03, 0.03); O.sun.setRGB(1, 0.25, 0.15);
      O.cloud.setRGB(0.32, 0.02, 0.02); O.cloudE.setRGB(0.2, 0, 0);
      if (Math.random() < dt * 1.2) V.flick = 0.15 + Math.random() * 0.3; V.flick *= Math.exp(-dt * 9);
      O.hemiI = 0.62 - V.flick; O.sunMul = 0.45; O.fogNear = 14; O.fogFar = 125; O.stars = 0; O.horror = 1;
    }
    V.sc += ((active ? 1 : 0) - V.sc) * Math.min(1, dt * (active ? 0.7 : 1.6));
    V.skyG.visible = O.k > 0.3 && (active || O.to > 0);
    if (V.skyG.visible) { const g = V.skyG.userData.glow; g.material.opacity = 0.14 + 0.08 * Math.sin(t * 2.2); V.skyG.rotation.z = Math.sin(t * 0.7) * 0.05; }
    if (V.sc < 0.01 && !active) { V.g.visible = false; V.on = false; return; }
    const P = G.player.pos;
    let dx = P.x - V.pos.x, dz = P.z - V.pos.z, d = Math.hypot(dx, dz) || 1;
    if (active) {
      const sp = d > 10 ? 2.4 : d > 5.5 ? 0.5 : 0;
      V.pos.x += dx / d * sp * dt; V.pos.z += dz / d * sp * dt;
      V.glitchT -= dt;
      if (V.glitchT <= 0) {   // рывок ближе + вспышка

        const k = Math.max(4.5, d * 0.55); V.pos.x = P.x - dx / d * k; V.pos.z = P.z - dz / d * k;
        G.shake(0.22); G.emit('thunder'); G.audio.play('thunder');
      }
      dx = P.x - V.pos.x; dz = P.z - V.pos.z; d = Math.hypot(dx, dz) || 1;
    }
    const near = d < 9 ? (9 - d) / 9 : 0, tw = 0.05 * (0.4 + near * 1.6);
    const y = 2.0 + Math.sin(t * 1.7) * 0.25, R = 1.7 * V.sc;
    V.g.position.set(V.pos.x + (Math.random() - 0.5) * tw, y, V.pos.z + (Math.random() - 0.5) * tw);
    V.g.lookAt(P.x, y + 0.2, P.z);
    const sq = Math.sin(t * 8) * 0.06;
    V.g.scale.set(R * (1 + sq), R * (1 - sq), R);
    V.glow.material.opacity = 0.16 + 0.12 * Math.sin(t * 5) + near * 0.15;
  }

  G.initEvents = function (scene) {
    const low = G.Q.fps <= 30;
    FN = low ? 420 : 900; SN = low ? 110 : 220;
    const tex = glowTex();
    const mk = (n, size) => {
      const pos = new Float32Array(n * 3).fill(-999), col = new Float32Array(n * 3);
      const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos, 3)); g.setAttribute('color', new T.BufferAttribute(col, 3));
      const m = new T.PointsMaterial({ size, map: tex, vertexColors: true, transparent: true, depthWrite: false, blending: T.AdditiveBlending, sizeAttenuation: true });
      const p = new T.Points(g, m); p.frustumCulled = false; p.renderOrder = 9; scene.add(p);
      return { p, pos, col };
    };
    const a = mk(FN, 1.3); fw = a.p; fwPos = a.pos; fwCol = a.col;
    fwP = []; for (let i = 0; i < FN; i++) fwP.push({ life: 0, max: 1, vx: 0, vy: 0, vz: 0, r: 0, g: 0, b: 0 });
    const b = mk(SN, 0.45); sky = b.p; skyPos = b.pos; skyCol = b.col;
    skyP = []; for (let i = 0; i < SN; i++) skyP.push({ x: 0, y: 0, z: 0, vy: 0, ph: Math.random() * 6, h: 0 });
    player = G.player;
    buildDisco(scene); buildVerity(scene);
  };

  function burst(x, y, z, color, n) {
    const c = new T.Color(color), shape = Math.random();
    for (let i = 0; i < n; i++) {
      const k = fwHead; fwHead = (fwHead + 1) % FN; const p = fwP[k];
      let th = Math.random() * 6.283, ph = Math.acos(2 * Math.random() - 1), sp = 9 + Math.random() * 3;
      if (shape < 0.3) { ph = Math.PI / 2 + (Math.random() - 0.5) * 0.25; sp = 11; }   // кольцо
      p.vx = Math.cos(th) * Math.sin(ph) * sp; p.vy = Math.cos(ph) * sp; p.vz = Math.sin(th) * Math.sin(ph) * sp;
      p.life = p.max = 1.5 + Math.random() * 0.7;
      const j = Math.random() < 0.25 ? new T.Color(1, 1, 1) : c;
      p.r = j.r; p.g = j.g; p.b = j.b;
      fwPos[k * 3] = x; fwPos[k * 3 + 1] = y; fwPos[k * 3 + 2] = z;
    }
  }
  G.fireworks = function (colors, far) {
    const P = G.player.pos, a = Math.random() * 6.283, d = 22 + Math.random() * 26;
    const x = P.x + Math.cos(a) * d, z = P.z + Math.sin(a) * d, y = 20 + Math.random() * 14;
    burst(x, y, z, colors[Math.floor(Math.random() * colors.length)], G.Q.fps <= 30 ? 40 : 70);
    setTimeout(() => G.audio.boom && G.audio.boom(true), 350 + d * 8);
  };

  function stepFx(dt, t) {
    if (!fw) return;
    let dirty = false;
    for (let i = 0; i < FN; i++) {
      const p = fwP[i]; if (p.life <= 0) continue;
      p.life -= dt; dirty = true;
      if (p.life <= 0) { fwPos[i * 3 + 1] = -999; fwCol[i * 3] = fwCol[i * 3 + 1] = fwCol[i * 3 + 2] = 0; continue; }
      p.vy -= 5.5 * dt; p.vx *= 1 - dt * 1.4; p.vz *= 1 - dt * 1.4; p.vy *= 1 - dt * 0.8;
      fwPos[i * 3] += p.vx * dt; fwPos[i * 3 + 1] += p.vy * dt; fwPos[i * 3 + 2] += p.vz * dt;
      const f = Math.min(1, p.life / p.max * 1.6) * (0.75 + 0.25 * Math.sin(t * 40 + i));
      fwCol[i * 3] = p.r * f; fwCol[i * 3 + 1] = p.g * f; fwCol[i * 3 + 2] = p.b * f;
    }
    if (dirty) { fw.geometry.attributes.position.needsUpdate = true; fw.geometry.attributes.color.needsUpdate = true; }

    // небесные искры: коробка вокруг игрока
    const ev = G.evt, show = !!ev;
    sky.visible = show;
    if (!show) return;
    const P = G.player.pos, kind = ev.def.sky;
    const fall = kind === 'diamond' ? 1.7 : kind === 'verity' ? 2.2 : 1;
    for (let i = 0; i < SN; i++) {
      const p = skyP[i];
      if (p.vy === 0) { p.x = (Math.random() - 0.5) * 70; p.z = (Math.random() - 0.5) * 70; p.y = Math.random() * 24; p.vy = 1.4 + Math.random() * 2; p.h = Math.random(); }
      p.y -= p.vy * dt * fall;
      if (p.y < 0) { p.y = 24; p.x = (Math.random() - 0.5) * 70; p.z = (Math.random() - 0.5) * 70; p.h = Math.random(); }
      skyPos[i * 3] = P.x + p.x + Math.sin(t * 0.6 + p.ph) * 0.8; skyPos[i * 3 + 1] = p.y; skyPos[i * 3 + 2] = P.z + p.z;
      const c = tmp;
      if (kind === 'gold') c.setRGB(1, 0.78 + p.h * 0.2, 0.2 + p.h * 0.25);
      else if (kind === 'rainbow') c.setHSL((p.h + t * 0.05) % 1, 0.9, 0.62);
      else if (kind === 'diamond') c.setRGB(0.6 + p.h * 0.4, 0.9, 1);
      else if (kind === 'verity') c.setRGB(0.55 + p.h * 0.45, 0.02, 0.02);
      else if (kind === 'disco') c.setHSL((p.h + D.hue * 2) % 1, 1, 0.6);
      else c.setHSL(p.h, 0.95, 0.6);
      const tw = 0.55 + 0.45 * Math.sin(t * 5 + p.ph * 3);
      skyCol[i * 3] = c.r * tw; skyCol[i * 3 + 1] = c.g * tw; skyCol[i * 3 + 2] = c.b * tw;
    }
    sky.geometry.attributes.position.needsUpdate = true; sky.geometry.attributes.color.needsUpdate = true;
  }
  const tmp = new T.Color();

  // ---------- управление ивентом ----------
  const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  G.startEvent = function (id) {
    const def = G.EVENTS.find((e) => e.id === id) || G.EVENTS[0];
    G.evt = { def, t: DUR, fwT: 0 };
    E.last = def.id;
    G.setWeather && G.setWeather(def.weather);
    G.audio.eventTrack(def.id);   // музыка только у Дискотеки и Verity
    G.emit('toast', { t: 'ИВЕНТ: ' + def.name + '! ' + def.desc, k: 'gold' });
    if (def.id === 'disco') { G.dancing = true; D.on = true; floorKey = ''; O.to = 1; }
    else if (def.id === 'verity') { O.to = 1; verityStart(); infectFish(); }
    else for (let i = 0; i < 6; i++) setTimeout(() => G.fireworks(def.colors), i * 380);
    const b = $('#evt'); if (b) { b.hidden = false; b.className = 'ev-' + def.id; $('#evtName').textContent = def.icon + ' ' + def.name; $('#evtDesc').textContent = def.desc; }
  };
  G.endEvent = function () {
    if (!G.evt) return;
    G.emit('toast', { t: 'Ивент закончился: ' + G.evt.def.name, k: '' });
    G.evt = null; G.audio.stopEventTrack();
    G.dancing = false; D.on = false; O.to = 0;
    if (G.env) G.env.wTimer = 6;
    const b = $('#evt'); if (b) b.hidden = true;
    E.next = PERIOD - DUR;   // следующий через 3 минуты: всего 5 минут от старта до старта
  };
  G.forceEvent = function (id) { if (G.evt) G.endEvent(); G.startEvent(id); };

  G.updateEvents = function (dt, t) {
    if (!G.menuOpen) {
      if (G.evt) {
        const ev = G.evt; ev.t -= dt; ev.fwT -= dt;
        if (ev.fwT <= 0) {
          const id = ev.def.id;
          if (id !== 'verity') G.fireworks(id === 'disco' ? ['#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'), ...ev.def.colors] : ev.def.colors);
          ev.fwT = id === 'fest' ? 0.5 + Math.random() * 0.8 : id === 'disco' ? 0.9 + Math.random() * 0.8 : 1.6 + Math.random() * 2.2;
        }
        $('#evtTime').textContent = fmt(Math.max(0, ev.t));
        if (ev.t <= 0) G.endEvent();
      } else {
        E.next -= dt;
        if (E.next <= 0) {
          const pool = G.EVENTS.filter((e) => e.id !== E.last); G.startEvent(pool[Math.floor(Math.random() * pool.length)].id);
        }
      }
    }
    const h = $('#hEvt');
    if (h && Math.random() < 0.1) h.textContent = G.evt ? '' : 'Ивент через ' + Math.max(1, Math.ceil(E.next / 60)) + ' мин';
    // плавный вход/выход неба и света
    O.k += (O.to - O.k) * Math.min(1, dt * 0.9);
    if (O.to === 0 && O.k < 0.004) O.k = 0;
    updateDisco(dt, t);
    updateVerity(dt, t);
    stepFx(dt, t);
  };
})();

/* post.js — шейдер постобработки: мягкое свечение, виньетка, тонировка по времени суток, зерно, капли дождя; можно выключить в настройках */
(function () {
  const G = window.G;
  const T = THREE;
  const P = (G.post = { on: false, ready: false });
  let rt, quad, qscene, qcam, mat;

  const FRAG = [
    'uniform sampler2D tDiffuse; uniform vec2 uPx; uniform float uTime, uNight, uRain, uFog, uFlash, uDay, uHor;',
    'varying vec2 vUv;',
    'float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
    'void main(){',
    '  vec2 uv = vUv;',
    '  vec3 c = texture2D(tDiffuse, uv).rgb;',
    '  // мягкое свечение: 8 выборок вокруг, берём только яркое',
    '  vec3 g = vec3(0.0);',
    '  for (int i = 0; i < 8; i++) {',
    '    float a = float(i) * 0.785398;',
    '    vec2 o = vec2(cos(a), sin(a)) * uPx * 5.0;',
    '    vec3 s = texture2D(tDiffuse, uv + o).rgb + texture2D(tDiffuse, uv + o * 2.2).rgb;',
    '    g += max(s * 0.5 - vec3(0.86), vec3(0.0));',
    '  }',
    '  c += g * (0.16 + uNight * 0.35);',
    '  c = c / (1.0 + max(c - vec3(0.62), vec3(0.0)) * 0.55);',
    '  // цветокоррекция: чуть насыщеннее и контрастнее, ночью холоднее, на закате теплее',
    '  float l = dot(c, vec3(0.299, 0.587, 0.114));',
    '  c = mix(vec3(l), c, 0.93 - uRain * 0.25 - uFog * 0.2);',
    '  c = (c - 0.5) * 1.0 + 0.5;',
    '  c *= mix(vec3(1.0), vec3(0.82, 0.92, 1.1), uNight);',
    '  c += vec3(0.04, 0.012, -0.02) * 2.2 * uDay * (1.0 - uDay);',
    '  // виньетка',
    '  c = mix(c, c * vec3(1.4, 0.45, 0.45), uHor * 0.55);',
    '  vec2 q = uv - 0.5; float v = 1.0 - dot(q, q) * (0.6 + uNight * 0.4 + uHor * 1.7);',
    '  v *= 1.0 - uHor * 0.1 * hash(vec2(floor(uTime * 11.0), 3.0));',
    '  c *= clamp(v, 0.0, 1.0);',
    '  // капли дождя на «объективе»',
    '  if (uRain > 0.05) {',
    '    vec2 gp = uv * vec2(14.0, 8.0); vec2 id = floor(gp); vec2 f = fract(gp) - 0.5;',
    '    float h = hash(id); float life = fract(uTime * 0.12 + h);',
    '    float d = length(f - vec2((h - 0.5) * 0.4, 0.3 - life * 0.9));',
    '    float drop = smoothstep(0.1, 0.02, d) * step(0.55, h) * uRain * (1.0 - life);',
    '    c += drop * 0.12;',
    '  }',
    '  c += vec3(uFlash * 0.5);',
    '  // зерно',
    '  c += (hash(uv * 1000.0 + uTime) - 0.5) * 0.012;',
    '  gl_FragColor = vec4(c, 1.0);',
    '}',
  ].join('\n');
  const VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';

  P.init = function (renderer) {
    mat = new T.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uPx: { value: new T.Vector2(1, 1) }, uTime: { value: 0 }, uNight: { value: 0 }, uRain: { value: 0 }, uFog: { value: 0 }, uFlash: { value: 0 }, uDay: { value: 0.5 }, uHor: { value: 0 } },
      vertexShader: VERT, fragmentShader: FRAG, depthTest: false, depthWrite: false,
    });
    quad = new T.Mesh(new T.PlaneGeometry(2, 2), mat); quad.frustumCulled = false;
    qscene = new T.Scene(); qscene.add(quad); qcam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    P.renderer = renderer; P.ready = true;
    P.resize();
  };

  P.resize = function () {
    if (!P.ready) return;
    const r = P.renderer, s = r.getDrawingBufferSize(new T.Vector2());
    if (rt) rt.dispose();

/* fishing.js — красный круг, заброс, поклёвка, мини-игра, вылов */
(function () {

    G.audio.play('tap', F.progress / 100);
    const b = bobber.position;
    if (F.pressCount % 2 === 0) G.fx.emit(b.x, G.WL, b.z, 5, { color: '#e8f8ff', speed: 2.5, up: 1.4, life: 0.5 });
    G.emit('press');
  };

  F.afterCard = function (again) {
    if (F.state !== 'card') return;
    F.state = 'zone'; F.zoneT = 0; hideLine(); showRod(false);
    G.player.group.userData.arms[1].rotation.x = 0;
    G.emit('fish-state', 'zone');
    if (again) F.start();
  };

  // ---------- мини-игра ----------
  function bite() {
    F.pending = G.rollCatch(F.spot.def);
    F.state = 'reeling'; F.t = 0; F.progress = 14; F.grace = 0.8; F.zeroT = 0;
    const b = bobber.position;
    G.fx.splash(b.x, b.z, 26); G.fx.ripple(b.x, b.z, 2.4);
    G.audio.play('bite'); G.shake(0.05);
    shadow.visible = true;
    const def = F.pending.fish; shadow.userData.size = 0.5 + def.size * 0.28;
    G.emit('fish-state', 'reeling');
  }

  function escape() {
    G.fx.splash(bobber.position.x, bobber.position.z, 18); G.fx.ripple(bobber.position.x, bobber.position.z, 2.2);
    G.audio.play('fail'); G.fovKick = 0;
    hideLine(); showRod(false); G.player.group.userData.arms[1].rotation.x = 0;
    F.state = 'zone'; F.zoneT = 0; F.pending = null;
    G.S.stats.escaped = (G.S.stats.escaped || 0) + 1;
    G.emit('toast', { t: 'Рыба сорвалась! Жми быстрее и не останавливайся', k: '' });
    G.emit('fish-state', 'zone');
  }

  function landFish() {
    F.state = 'landing'; F.t = 0;
    const c = F.pending;
    flyFish = G.makeFish(c.fish, c.mut);
    flyFish.scale.multiplyScalar(0.6);
    flyFish.rotation.order = 'YXZ';
    G.scene.add(flyFish);
    F.flyStart = bobber.position.clone();
    shadow.visible = false; line.visible = false; bobber.visible = false;
    const b = F.flyStart; G.fx.splash(b.x, b.z, 40); G.fx.ripple(b.x, b.z, 3.2);
    G.audio.play('splash');
    G.emit('fish-state', 'landing');
  }

  function arrived() {
    const c = F.pending, P = G.player, r = c.fish.r;
    const pos = flyFish.position;
    const colr = c.mut ? G.MUTATIONS[c.mut].color : G.RARITIES[r].color;
    G.fx.burst(pos.x, pos.y, pos.z, 30 + r * 14, colr, r >= 6 || c.mut === 'rainbow');
    if (r >= 3) G.shake(0.05 + r * 0.02);
    const res = G.registerCatch(c.fish, c.mut);
    F.state = 'card'; F.t = 0;
    G.scene.remove(flyFish); G.disposeObj(flyFish); flyFish = null;
    G.audio.play(r >= 6 ? 'epic' : r >= 3 ? 'rare' : 'catch');
    G.emit('catch', { fish: c.fish, mut: c.mut, isNew: res.isNew, xp: res.xp, spot: F.spot.def });
    G.emit('fish-state', 'card');
  }

  // ---------- обновление ----------
  F.update = function (dt, t) {
    const P = G.player, W = G.world;
    F.zoneCooldownCheck(P.pos);

    if (F.state === 'idle') {
      for (const sp of W.spots) {
        const d = Math.hypot(P.pos.x - sp.ringPos.x, P.pos.z - sp.ringPos.z);
        if (sp.def.secret && !G.S.spots[sp.def.id] && Math.hypot(P.pos.x - sp.def.cx, P.pos.z - sp.def.cz) < Math.max(sp.def.rx, sp.def.rz) + 12) {
          G.S.spots[sp.def.id] = true; G.emit('toast', { t: 'Найдено секретное место: ' + sp.def.name + '!', k: 'gold' }); G.checkAch(); G.save();
        }
        if (d < sp.ringR && F.cooldown !== sp && !G.modalOpen && P.pos.y < 0.3) { enterZone(sp); break; }
      }
    }

    if (F.state !== 'idle') {
      const sp = F.spot, arm = P.group.userData.arms[1];
      if (F.state === 'zone') {
        F.zoneT += dt;
        // плавно встать в центр круга
        const k = 1 - Math.exp(-dt * 7);
        P.pos.x += (sp.ringPos.x - P.pos.x) * k; P.pos.z += (sp.ringPos.z - P.pos.z) * k;
        if (F.zoneT > 0.5 && P.rawInput() > 0.5 && !G.modalOpen) leaveZone();
        arm.rotation.x += (0 - arm.rotation.x) * k;
      } else {
        P.pos.x += (sp.ringPos.x - P.pos.x) * (1 - Math.exp(-dt * 4)); P.pos.z += (sp.ringPos.z - P.pos.z) * (1 - Math.exp(-dt * 4));
        P.faceTo = Math.atan2(sp.face.x, sp.face.z);
      }

      if (rod && rod.visible) {
        const s = rod.scale.x; if (s < 1) rod.scale.setScalar(Math.min(1, s + dt * 5 + 0.001));
        rod.userData.update(t);
      }

      if (F.state === 'casting') {
        F.t += dt;
        const u = F.t / 0.95;
        // замах → бросок
        arm.rotation.x = u < 0.35 ? -1.25 - (u / 0.35) * 1.1 : -2.35 + ((u - 0.35) / 0.65) * 1.2;
        if (u > 0.5) {
          const k = Math.min(1, (u - 0.5) / 0.5), tip = tipPos();
          bobber.visible = line.visible = true;
          bobber.position.lerpVectors(tip, F.target, k); bobber.position.y += Math.sin(k * Math.PI) * 3.2;
          drawLine(tip, bobber.position, 0.0);
          if (k >= 1) {
            bobber.position.y = G.WL;
            G.fx.splash(F.target.x, F.target.z, 14); G.fx.ripple(F.target.x, F.target.z, 1.8); G.audio.play('splash');
            F.state = 'waiting'; F.t = 0; F.wait = G.biteWait();
            arm.rotation.x = -1.25;
            G.emit('fish-state', 'waiting');
          }
        }
      } else if (F.state === 'waiting') {
        F.t += dt;
        arm.rotation.x += (-1.2 - arm.rotation.x) * (1 - Math.exp(-dt * 6));
        bobber.position.set(F.target.x + Math.sin(t * 1.3) * 0.04, G.WL + 0.03 + Math.sin(t * 2.5) * 0.025, F.target.z);
        if (t - lastRipple > 1.6) { lastRipple = t; G.fx.ripple(F.target.x, F.target.z, 1.1); }
        drawLine(tipPos(), bobber.position, 0.35);
        if (F.t > F.wait) bite();
      } else if (F.state === 'reeling') {
        F.t += dt;
        if (F.grace > 0) F.grace -= dt; else F.progress = Math.max(0, F.progress - G.decay(F.pending.fish.r) * dt);
        // если полоска пуста слишком долго, рыба срывается
        if (F.progress <= 0.01 && F.grace <= 0) { F.zeroT += dt; if (F.zeroT > G.escapeTime(F.pending.fish.r)) { escape(); return; } } else F.zeroT = 0;
        const k = F.progress / 100;
        const sh = 0.07 + 0.1 * (1 - k);
        bobber.position.set(F.target.x + (Math.random() - 0.5) * sh, G.WL - 0.04 + Math.sin(t * 20) * 0.03, F.target.z + (Math.random() - 0.5) * sh);
        // тень рыбы кружит
        const a = t * (2.2 + F.pending.fish.r * 0.35), rad = 0.9 + Math.sin(t * 1.7) * 0.35;
        shadow.position.set(F.target.x + Math.cos(a) * rad, G.WL - 0.01, F.target.z + Math.sin(a) * rad);
        shadow.rotation.y = -(a + Math.PI / 2);
        const sz = shadow.userData.size || 0.8; shadow.scale.set(sz, 0.04, sz * 0.38);
        // натяжение
        arm.rotation.x = -1.2 + Math.sin(t * 17) * 0.04 * (1 - k) - k * 0.2;
        rod.rotation.x = 2.15 + Math.sin(t * 15) * 0.05 * (1 - k) + k * 0.25;
        drawLine(tipPos(), bobber.position, 0.08 + 0.1 * k);
        if (Math.random() < dt * 5) G.fx.emit(F.target.x, G.WL, F.target.z, 2, { color: '#e8f8ff', speed: 2, up: 1.2, life: 0.4 });
        G.fovKick = 3 * k;
        if (F.progress >= 100) { G.fovKick = 0; rod.rotation.x = 2.15; landFish(); }
      } else if (F.state === 'landing') {
        F.t += dt;
        const k = Math.min(1, F.t / 1.15), s = F.flyStart;
        const ex = P.pos.x + Math.sin(P.yaw) * 0.6, ez = P.pos.z + Math.cos(P.yaw) * 0.6, ey = 3.3;
        const px = s.x + (ex - s.x) * k, pz = s.z + (ez - s.z) * k, py = s.y + (ey - s.y) * k + Math.sin(k * Math.PI) * 2.6;
        flyFish.position.set(px, py, pz);
        const dx = ex - s.x, dz = ez - s.z;
        flyFish.rotation.y = -Math.atan2(dz, dx) + Math.PI * (k > 0.5 ? 0 : 0);
        flyFish.rotation.x = k * Math.PI * 4;
        flyFish.userData.update(t);
        arm.rotation.x = -1.2 + Math.sin(k * Math.PI) * -0.6;
        if (k >= 1) arrived();
      } else if (F.state === 'card') {
        arm.rotation.x += (-1.0 - arm.rotation.x) * 0.1;
      }
    }
  };

  const tv = new T.Vector3();
  function tipPos() {
    const tip = rod.userData.tip;
    tip.updateWorldMatrix(true, false);
    return tip.getWorldPosition(tv);
  }
  const vA = new T.Vector3(), vB = new T.Vector3();
  function drawLine(a, b, sag) {
    vA.copy(a); vB.copy(b);
    for (let i = 0; i < NL; i++) {
      const k = i / (NL - 1);
      linePts[i * 3] = vA.x + (vB.x - vA.x) * k;
      linePts[i * 3 + 1] = vA.y + (vB.y - vA.y) * k - Math.sin(k * Math.PI) * sag * (1 + Math.abs(vB.x - vA.x) * 0.05);
      linePts[i * 3 + 2] = vA.z + (vB.z - vA.z) * k;
    }
    line.geometry.attributes.position.needsUpdate = true;
    line.visible = true;
  }
})();

/* pond.js — рыбы, плавающие в личном пруду, и подпись дохода */
(function () {
  const G = window.G;
  const T = THREE;
  const V = (G.pondView = { items: [] });
  let group = null;

  V.init = function (scene) { group = new T.Group(); scene.add(group); V.sync(); G.on('pond', V.sync); G.on('levelup', V.label); G.on('upgrade', V.label); };

  V.sync = function () {
    for (const it of V.items) { group.remove(it.obj); G.disposeObj(it.obj); }
    V.items = [];
    const H = G.HOME_POND;
    G.S.pond.forEach((f, i) => {
      const def = G.FISH_BY_ID[f.f];
      const obj = G.makeFish(def, G.vm(f), G.Q.fishDetail);
      obj.scale.multiplyScalar(0.42);
      group.add(obj);
      const ring = i % 3, fr = 0.28 + ring * 0.22 + Math.random() * 0.08;
      V.items.push({ obj, a: Math.random() * 6.28, dir: Math.random() < 0.5 ? 1 : -1, sp: (0.35 + Math.random() * 0.25) / (0.5 + fr), f: fr, ph: Math.random() * 6, yaw: 0, H });
    });
    V.label();
  };

  V.label = function () {
    const W = G.world; if (!W) return;
    const txt = '$' + G.fmt(G.incomePerSec()) + '/сек';
    if (W.incLabel._last !== txt) { W.incLabel._last = txt; W.incLabel.userData.set(txt, '#8dffb0'); }
  };

  V.update = function (dt, t) {
    const H = G.HOME_POND;
    for (const it of V.items) {
      it.a += it.dir * it.sp * dt;
      const wob = 1 + Math.sin(t * 0.7 + it.ph) * 0.08;
      const x = H.cx + Math.cos(it.a) * H.rx * it.f * wob, z = H.cz + Math.sin(it.a) * H.rz * it.f * wob;
      const dx = -Math.sin(it.a) * H.rx * it.dir, dz = Math.cos(it.a) * H.rz * it.dir;
      const want = -Math.atan2(dz, dx);
      it.yaw = G.lerpAngle(it.yaw, want, 1 - Math.exp(-dt * 6));
      it.obj.position.set(x, G.WL + 0.02 + Math.sin(t * 1.4 + it.ph) * 0.04 + (G.dancing ? Math.abs(Math.sin(t * 5.236 + it.ph)) * 0.45 : 0), z);
      it.obj.rotation.y = it.yaw;
      it.obj.userData.update(t + it.ph);
    }
  };
})();

        return h + '<div class="pbody"><button class="btn small" data-a="colback">← Назад</button><div class="detail r' + d.r + '" style="--rc:' + rar(d.r).color + ';margin-top:12px">' +
          '<div class="fcard r' + d.r + '" style="padding:10px"><div class="fimg" style="aspect-ratio:1"><img alt="" style="width:100%" src="' + G.fishIcon(d) + '"></div></div><div class="dd"><h2 style="margin:0;font:700 30px var(--disp)">' + esc(d.name) + '</h2><div>' + tagH(d.r) + '</div>' +

          '<div class="kv"><span>Шанс выпадения</span><b>' + (locked ? 'нужна удочка получше' : G.pct(ch)) + '</b></div>' +
          '<div class="kv"><span>Поймано</span><b>' + c.n + '</b></div><div class="row">' + muts + '</div></div></div></div>';
      }
      h += '<div class="pbody"><div class="bar"><i style="width:' + (n / tot * 100) + '%"></i></div>';
      G.RARITIES.forEach((r, ri) => {
        const list = G.FISH_BY_RARITY[ri], got = list.filter((f) => S.col[f.id]).length;
        h += '<div class="sec">' + rname(ri) + '<span class="sub">' + got + '/' + list.length + '</span></div><div class="grid">';
        list.forEach((d) => {
          const c = S.col[d.id];
          if (c) h += '<div class="fcard pick r' + ri + '" data-a="colsel" data-id="' + d.id + '"><div class="fimg"><img alt="" src="' + G.fishIcon(d) + '"></div><div class="fname">' + esc(d.name) + '</div><div class="finc">$' + G.fmt(d.inc) + '/сек</div><div class="sub" style="font-size:12px">' + G.pct(G.fishChance(d, G.SPOTS[0])) + '</div></div>';
          else h += '<div class="fcard unk r' + ri + '"><div class="fimg"><img alt="" src="' + G.fishIcon(d) + '"></div><div class="fname">???</div><div class="finc" style="color:var(--mut)">$???</div><div class="sub" style="font-size:12px">Не поймана</div></div>';
        });
        h += '</div>';
      });
      return h + '</div>';
    },

    market() {
      const S = G.S, m = G.market.mult;
      const sorted = S.inv.slice().sort((a, b) => G.sellPrice(b) - G.sellPrice(a));

      const cnt = (pred) => S.inv.filter(pred).length;
      const bulk = [['c0', 'Обычные', (f) => G.FISH_BY_ID[f.f].r === 0 && !f.m && !f.h], ['c1', 'Обычные и необычные', (f) => G.FISH_BY_ID[f.f].r <= 1 && !f.m && !f.h], ['c2', 'Всё, кроме эпических и выше', (f) => G.FISH_BY_ID[f.f].r <= 2 && !f.m && !f.h]];
      let h = head('Рынок', '<span class="sub">' + S.inv.length + ' рыб в рюкзаке</span>') + '<div class="pbody">';
      h += '<div class="merch"><div class="av">Б</div><div class="sp"><b style="font:700 17px var(--disp)">Торговец Бахтиёр</b><div class="sub">Покупаю рыбу. Цена зависит от спроса, он меняется каждые пару минут.</div></div></div>';
      h += '<div class="demand">' + G.RARITIES.map((r, i) => { const v = m[i], c = v >= 1.15 ? 'up' : v <= 0.95 ? 'dn' : ''; return '<span class="dchip r' + i + ' ' + c + '">' + r.name + ' <b>×' + v.toFixed(2) + (v >= 1.15 ? ' ▲' : v <= 0.95 ? ' ▼' : '') + '</b></span>'; }).join('') + '</div>';
      h += '<div class="row" style="margin-bottom:14px">' + bulk.map((b) => { const n = cnt(b[2]); return '<button class="btn small gold ' + (n ? '' : 'off') + '" data-a="mbulk" data-id="' + b[0] + '">' + b[1] + ' (' + n + ') · ' + G.money(sum(b[2])) + '</button>'; }).join('') +
        '<button class="btn small ' + (ui.confirm === 'mall' ? 'danger' : 'ghost') + ' ' + (S.inv.length ? '' : 'off') + '" data-a="mbulk" data-id="all">' + (ui.confirm === 'mall' ? 'Точно продать всё?' : 'Продать всё · ' + G.money(sum(() => true))) + '</button></div>';

      else h += '<div class="grid">' + sorted.map((f) => {

      }).join('') + '</div>';
      return h + '</div>';
    },

    },

    settings() {

      if (!G.menuOpen) h += '<div class="sec">Перемещение</div><div class="row"><button class="btn small pri" data-a="tppond">К моему пруду</button><button class="btn small pri" data-a="tpmain">К большому пруду</button><button class="btn small pri" data-a="tpmarket">К рынку</button><button class="btn small pri" data-a="tpspawn">В начало</button></div>';
      if (!G.menuOpen) h += '<div class="sec">Ивенты (раз в 5 минут, по 2 минуты)</div><div class="row">' + G.EVENTS.map((e) => '<button class="btn small" data-a="evt" data-id="' + e.id + '">' + e.icon + ' ' + e.name + '</button>').join('') + '</div><p class="sub" style="margin:6px 0 0;font-size:12px">Чтобы запустить ивент, нужно ввести код.</p>';
      h += '<div class="sec">Промокод</div><div class="promorow"><input class="cin" id="promoIn" data-a="promoin" type="text" placeholder="Введи промокод" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24" value="' + (ui.promoText || '').replace(/"/g, '') + '"><button class="btn go" data-a="promo">Применить</button></div>';
      h += '<div class="sec">Игра</div><div class="row">' + (G.menuOpen ? '' : '<button class="btn small go" data-a="mainmenu">Главное меню</button>') + '<button class="btn small" data-a="tutorial">Обучение</button><button class="btn small danger" data-a="reset">' + (ui.confirm === 'reset' ? 'Точно удалить весь прогресс?' : 'Сбросить прогресс') + '</button></div>';
      h += '<p class="sub" style="margin:14px 0 0;font-size:13px">ПК: WASD ходить, Shift бежать, Пробел прыжок, E действие, ПКМ тянет рыбу, левая кнопка мыши вращает камеру. Клавиши: B магазин, I рюкзак, C рыбы, U прокачка, R Rebirth, M задания.</p>';
      return h + '</div>';
    },

      return head('Авторы') + '<div class="pbody"><div class="cred">' +
        '<div class="crow"><span>Автор</span><b>Mustafo</b></div>' +
        '<div class="crow"><span>Разработчик</span><b>Oyat</b></div>' +

        '<div class="crow"><span>AI помощник</span><b>Claude</b></div></div>' +
        '<div class="credfoot">Спасибо, что играешь в Рыбного Магната!</div></div>';

    tutorial() {
      const T = G.TUTORIAL, i = ui.slide || 0, s = T[i], last = i === T.length - 1;
      const key = (t) => '<span class="key">' + t + '</span>';
      const vis = [
        '<svg viewBox="0 0 80 40" style="width:110px;height:56px;color:#ffb020;fill:currentColor;stroke:none"><path d="M6 20c8-14 26-18 40-8 6 4 10 8 12 8l16-10c1 7 1 15 0 22L58 22c-2 0-6 4-12 8C32 38 14 34 6 20z"/><circle cx="22" cy="17" r="2.6" fill="#fff"/></svg>',
        key('W') + key('A') + key('S') + key('D') + key('Shift') + key('Пробел') + key('E') + '<span class="joy"></span>',

        key('E') + '<span class="sub">у пруда</span>' + '<span class="big-num">$</span>' + '<span class="sub">на рынке</span>',

      ][i];
      return head('Обучение', '<span class="sub">' + (i + 1) + ' / ' + T.length + '</span>') + '<div class="pbody"><div class="tut"><div class="tvis">' + vis + '</div><h3>' + s.t + '</h3><p>' + s.d + '</p>' +

    },
  };

  function render(first) {
    if (!ui.panel) return;
    const pn = $('#panel'), old = pn.querySelector('.pbody'), top = old ? old.scrollTop : 0;
    pn.className = 'panel' + (ui.panel === 'authors' || ui.panel === 'rebirth' || ui.panel === 'tutorial' ? ' small' : '');
    pn.innerHTML = panels[ui.panel]();
    const nb = pn.querySelector('.pbody');
    if (nb && !first) nb.scrollTop = top;
  }
  G.on('pond', () => { if (G.modalOpen) render(); });

  // ---------- Действия в панелях ----------
  $('#modal').addEventListener('pointerdown', (e) => { if (e.target.id === 'modal') ui.close(); });
  $('#modal').addEventListener('click', (e) => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, id = el.dataset.id, S = G.S;
    if (a === 'promoin') return;   // клик по полю ввода не должен перерисовывать панель
    const keepConfirm = (a === 'msell' && ui.confirm === 'ms' + id) || (a === 'mbulk' && id === 'all') || (a === 'rebirth') || (a === 'reset');
    if (!keepConfirm) ui.confirm = null;
    const ok = () => G.audio.play('buy'), no = () => G.audio.play('error');
    switch (a) {
      case 'close': ui.close(); return;
      case 'rod': { const r = G.buyRod(+id); if (r === 'poor') { no(); G.emit('toast', { t: 'Не хватает денег', k: '' }); } else { ok(); if (r === 'bought') G.emit('toast', { t: 'Куплена: ' + G.RODS[+id].name, k: 'good' }); } break; }
      case 'up': { const r = G.buyUpgrade(id); if (r === 'ok') ok(); else no(); break; }
      case 'place': if (!nearPond()) { no(); G.emit('toast', { t: 'Подойди к своему пруду' }); } else if (G.placeFish(+id)) G.audio.play('click'); else no(); break;
      case 'placebest': if (!nearPond() && ui.panel !== 'pond') { no(); break; } { const n = G.placeBest(); if (n) ok(); else no(); } break;
      case 'take': G.takeFish(+id); G.audio.play('click'); break;
      case 'colsel': ui.sel = id; G.audio.play('click'); render(true); return;
      case 'colback': ui.sel = null; render(true); return;
      case 'tab': ui.tab = id; ui.confirm = null; render(true); return;
      case 'daily': { const r = G.claimDaily(); if (r) { G.audio.play('level'); G.emit('toast', { t: 'Награда: ' + G.money(r.money) + (r.fish ? ' и ' + r.fish.name : ''), k: 'gold' }); } break; }
      case 'quest': if (G.claimQuest(+id)) G.audio.play('coin'); break;
      case 'rebirth': if (!G.canRebirth()) { no(); break; } if (ui.confirm === 'rb') { G.doRebirth(); ui.confirm = null; G.audio.play('epic'); G.emit('toast', { t: 'Rebirth! Доход и удача выросли навсегда', k: 'gold' }); } else ui.confirm = 'rb'; break;
      case 'quality': G.applyQuality(id); G.pondView.sync(); G.save(); break;
      case 'sound': S.set.sound = !S.set.sound; G.audio.applyVolumes(); G.save(); break;
      case 'fpsb': S.set.fps = !S.set.fps; G.save(); break;
      case 'reset': if (ui.confirm === 'reset') { G.resetAll(); location.reload(); return; } ui.confirm = 'reset'; break;
      case 'tppond': ui.close(); G.tpPond(); break;
      case 'tpmain': ui.close(); G.tpMain(); break;
      case 'msell': {
        const f = G.S.inv.find((x) => x.u === +id); if (!f) break;
        const risky = G.FISH_BY_ID[f.f].r >= 3 || f.m || f.h;
        if (risky && ui.confirm !== 'ms' + id) { ui.confirm = 'ms' + id; break; }
        const p = G.sellFish(+id); ui.confirm = null; if (p) { G.audio.play('coin'); G.emit('toast', { t: 'Продано за ' + G.money(p), k: 'good' }); }
        break;
      }
      case 'mbulk': {
