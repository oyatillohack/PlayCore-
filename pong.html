let hw2=2.3;const cp=new V(0,3,6),lk=new V(),tp=new V(),tl=new V();
function camUp(dt,t){if(G.mode=='pvp'){const ta=Math.tan(cam.fov*Math.PI/360),d=Math.max(4.3/ta,2.2/(ta*cam.aspect));hw2=d*ta*cam.aspect;cam.up.set(0,0,-1);cp.set(0,d,0);lk.set(0,0,0);cam.position.copy(cp);cam.lookAt(lk);return}cam.up.set(0,1,0);if(G.mode=='demo'){tp.set(Math.sin(t*.12)*6.5,2.6+Math.sin(t*.25)*.4,Math.cos(t*.12)*6.5);tl.set(0,.2,0)}else{tp.set(0,3.4,5.8);tl.set(0,0,-.6)}const f=1-Math.pow(.02,dt);cp.lerp(tp,f);lk.lerp(tl,f);cam.position.copy(cp);cam.lookAt(lk)}
function update(dt){[0,1].forEach(i=>{const o=px[i];if(G.ai[i])aiMove(i,dt);else px[i]+=(tx[i]-px[i])*Math.min(1,dt*20);px[i]=cl(px[i],-1.7,1.7);pvl[i]+=((px[i]-o)/dt-pvl[i])*.3});
if(G.state=='count'){G.timer-=dt;B.x=px[G.srv];B.z=G.srv?-PZ+.05:PZ-.05;B.y=.4;B.vx=B.vy=B.vz=0;if(G.timer<=0){G.state='play';hit(G.srv,1)}}
else if(G.state!='over'){const n=Math.ceil(dt/.008);for(let k=0;k<n;k++)step(dt/n);if(G.state=='point'){G.timer-=dt;if(G.timer<=0)serve0()}}
[0,1].forEach(i=>{const p=PD3[i];p.position.x=px[i];p.position.y+=(cl(B.y,.25,1)-p.position.y)*Math.min(1,dt*8);p.position.z=i?-PZ-.05:PZ+.05;if(G.mode=='pvp'){p.rotation.set(i?Math.PI/2:-Math.PI/2,0,0);p.position.y=.2;p.scale.setScalar(1.43)}else{p.rotation.set(0,0,-pvl[i]*.05);p.scale.setScalar(1)}});
MAN.visible=arm.visible=G.mode=='ai';if(MAN.visible){MAN.position.x+=(px[1]*.45-MAN.position.x)*Math.min(1,dt*6);MAN.position.y=Math.abs(Math.sin(performance.now()/300))*.03+pu*.12;vs.set(MAN.position.x+.5,MAN.position.y+1.35,MAN.position.z);ve.set(px[1],PD3[1].position.y-.4,-PZ-.05);vd.subVectors(ve,vs);const ln=vd.length();arm.position.addVectors(vs,ve).multiplyScalar(.5);arm.quaternion.setFromUnitVectors(vY,vd.normalize());arm.scale.set(1,ln,1)}
ball.position.set(B.x,B.y,B.z);ball.rotation.x+=B.vz*dt*4;ball.rotation.z-=B.vx*dt*4;pu=Math.max(0,pu-dt*6);ball.scale.setScalar(1+pu*.4+(G.mode=='pvp'?.5:0));
for(let i=0;i<NP;i++){if(pf[i]>0){pf[i]-=dt;pv[i*3+1]-=9*dt;for(let k=0;k<3;k++)pp[i*3+k]+=pv[i*3+k]*dt}else pp[i*3+1]=-50}pg.attributes.position.needsUpdate=true}
let lt=performance.now();
let fN=0,fT=0;
function loop(now){requestAnimationFrame(loop);const ms=now-lt;if(S.fps==30&&ms<30)return;lt=now;
if(!BG&&!G.paused&&now>4000&&ms<250){fN++;fT+=ms;if(fT>2000){const f=fN*1000/fT;fN=fT=0;if(f<(S.fps==30?26:44)){if(S.q>0){S.q--;applyQ()}else if(rsc>.6){rsc=Math.max(.6,rsc-.15);applyQ()}}}}else if(BG){fN=fT=0}const dt=Math.max(.001,Math.min(ms/1000,.05));if(BG){bstep(dt);bdraw();return}if(!G.paused)update(dt);camUp(dt,now/1000);R.render(SC,cam)}
applyQ();applyLook();startDemo();requestAnimationFrame(loop);
setTimeout(()=>{$('ld').classList.add('off');setTimeout(()=>$('ld').remove(),800)},2300);
